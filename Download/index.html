<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day Surprise</title>
  <style>
    body {
      background-color: #fcd4d4;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    h1 {
      color: #ff6b6b;
      font-size: 3rem;
      margin-top: 50px;
    }

    .ribbons {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('https://i.pinimg.com/originals/a5/63/c3/a563c39274f017b67201d684f66e4b57.jpg') repeat;
      top: 0;
      left: 0;
      z-index: -1;
      opacity: 0.2;
    }

    .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-top: 50px;
    }

    .button {
      padding: 15px;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
    }

    .pixelated {
      image-rendering: pixelated;
    }

    .button img {
      width: 100px;
      height: 100px;
    }

    .hidden {
      display: none;
    }

    .surprise {
      font-size: 2rem;
      color: #ff6b6b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="ribbons"></div>

  <div class="container">
    <h1>Happy Valentine's Day</h1>
      <h1>My Ellie!</h1>

    <div class="button-container">
      <button class="button" id="flowersButton">
        <img src="https://img.icons8.com/ios/50/000000/flower.png" class="pixelated" alt="Bouquet of Flowers"/>
      </button>

      <button class="button" id="letterButton">
        <img src="https://img.icons8.com/ios/50/000000/love-letter.png" class="pixelated" alt="Love Letter"/>
      </button>

      <button class="button" id="chocolateButton">
        <img src="https://img.icons8.com/ios/50/000000/chocolate.png" class="pixelated" alt="Chocolates"/>
      </button>
    </div>

    <div id="flowersSurprise" class="hidden surprise">
      Flowers for you!💐
    </div>
    <div id="letterSurprise" class="hidden surprise">
      A heartfelt love letter for you! 💌
    </div>
    <div id="chocolateSurprise" class="hidden surprise">
      A delicious bite of chocolate! 🍫
    </div>
    <div class="container">
       
        <p>Choose your surprise:</p>
  </div>

  <script>
    document.getElementById("flowersButton").onclick = function() {
      document.getElementById("flowersSurprise").classList.remove("hidden");
      document.getElementById("letterSurprise").classList.add("hidden");
      document.getElementById("chocolateSurprise").classList.add("hidden");
    };

    document.getElementById("letterButton").onclick = function() {
      document.getElementById("flowersSurprise").classList.add("hidden");
      document.getElementById("letterSurprise").classList.remove("hidden");
      document.getElementById("chocolateSurprise").classList.add("hidden");
    };

    document.getElementById("chocolateButton").onclick = function() {
      document.getElementById("flowersSurprise").classList.add("hidden");
      document.getElementById("letterSurprise").classList.add("hidden");
      document.getElementById("chocolateSurprise").classList.remove("hidden");
    };
  </script>

</body>
</html>
